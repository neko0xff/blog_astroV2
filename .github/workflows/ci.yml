name: "CI: Build & Validate"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一 ref 的新 push 會取消還在跑的舊 run，避免浪費資源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Actions Runner Images: https://github.com/actions/runner-images/tree/main
  #
  # 注意：實際部署已改由新版 Deno Deploy（console.deno.com）的 GitHub 整合處理
  # （Deploy Classic + deployctl 已於 2026-07-20 停用），此 workflow 只負責 CI 驗證。
  build:
    name: Build & validate
    runs-on: ubuntu-latest

    permissions:
      contents: read # Clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned: Deno 2.7.x has a napi regression that breaks Vite 8 / rolldown builds
          # (see denoland/deno#33137). Keep in sync with local env and Dockerfile.env (2.9.4).
          deno-version: 2.9.4

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install step
        run: "deno task install"

      - name: Build and generate search index
        run: |
          set -e
          # Retry: intermittent Deno napi/rolldown race (denoland/deno#33137, #34008).
          # Deterministic errors still fail fast after 3 attempts.
          for attempt in 1 2 3; do
            if deno task build && deno task pagefind; then
              exit 0
            fi
            echo "::warning::Build attempt ${attempt}/3 failed (known intermittent Deno napi race), retrying..."
          done
          exit 1
        env:
          # Required so robots.txt includes AI scraper block rules from DarkVisitors.
          # Set this secret in GitHub repo settings: https://github.com/<owner>/<repo>/settings/secrets/actions
          DARK_VISITORS_TOKEN: ${{ secrets.DARK_VISITORS_TOKEN }}
