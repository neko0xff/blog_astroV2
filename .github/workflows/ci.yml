name: "CI: Build & Validate"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一 ref 的新 push 會取消還在跑的舊 run，避免浪費資源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Actions Runner Images: https://github.com/actions/runner-images/tree/main
  #
  # 注意：實際部署已改由新版 Deno Deploy（console.deno.com）的 GitHub 整合處理
  # （Deploy Classic + deployctl 已於 2026-07-20 停用），此 workflow 只負責 CI 驗證。
  build:
    name: Build & validate
    runs-on: ubuntu-latest

    permissions:
      contents: read # Clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned: Deno 2.7.x has a napi regression that breaks Vite 8 / rolldown builds
          # (see denoland/deno#33137). Keep in sync with local env and Dockerfile.env (2.9.7).
          deno-version: 2.9.7

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install step
        run: "deno task install"

      - name: Verify formatting and lint
        run: |
          set -e
          # CI 用唯讀變體：task 版 fmt/lint 會直接改檔，在 CI 會掩蓋問題
          deno fmt --check
          deno task format:check
          deno lint

      - name: Typecheck and test
        run: |
          set -e
          deno task check
          deno task check:tests
          deno task test
          # tsconfig.server.json 的涵蓋範圍（public/server.ts）沒有對應 task，這裡直接檢查
          deno check public/server.ts

      - name: Validate Kubernetes manifests
        # 離線 YAML 語法檢查；deploy-local.sh 不在此列（它是 shell，非 manifest）。
        # 不用 kubectl dry-run：它仍需連線做 API discovery，無叢集的 CI 跑不動。
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'EOF'
          import glob

          import yaml

          files = sorted(glob.glob("k8s/*.yaml"))
          assert files, "no manifests found"
          for path in files:
              with open(path) as f:
                  docs = list(yaml.safe_load_all(f))
              assert docs and all(isinstance(d, dict) for d in docs), path
              print(f"ok: {path}")
          EOF

      - name: Build and generate search index
        run: |
          set -e
          # Retry: intermittent Deno napi/rolldown race (denoland/deno#33137, #34008).
          # Deterministic errors still fail fast after 3 attempts.
          for attempt in 1 2 3; do
            if deno task build && deno task pagefind; then
              exit 0
            fi
            echo "::warning::Build attempt ${attempt}/3 failed (known intermittent Deno napi race), retrying..."
          done
          exit 1
