apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blog-astro
  namespace: blog-astro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blog-astro
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
