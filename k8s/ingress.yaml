apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-astro-ingress
  namespace: blog-astro
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - blog.example.com
      secretName: blog-astro-tls
  rules:
    - host: blog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-astro-service
                port:
                  number: 80
