apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-astro-ingress
  namespace: blog-astro
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # TODO(上線前): blog.example.com 是佔位符，換成自託管的真實網域後，
  # 再備好 blog-astro-tls 憑證 Secret（見 docs/ops.md 維運手冊）。
  tls:
    - hosts:
        - blog.example.com
      secretName: blog-astro-tls
  rules:
    - host: blog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-astro-service
                port:
                  number: 80
